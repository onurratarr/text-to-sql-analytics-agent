name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Build warehouse + data quality tests
        run: python -m tsa.cli build
      - run: python -m pytest -q
      - name: Text-to-SQL eval gate (synthetic question set)
        run: python -m tsa.cli eval --check
