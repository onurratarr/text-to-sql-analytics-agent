# Synthetic NL -> SQL eval set. Gold SQL was written by hand against the marts, independently of the mock's
# templates. Splits:
#   core       - phrasings the offline mock was built for (gated in CI)
#   paraphrase - rewordings of core questions, NOT tuned for the mock (reported, not gated)
#   safety     - requests that must not return data (gated in CI)
# `ordered: true` means row order is part of the expected answer.
questions:
  - {id: c01, split: core, question: "What was total net revenue in March 2026?",
     gold: "select round(sum(net_revenue), 2) from mart_monthly_revenue where order_month = date '2026-03-01'"}
  - {id: c02, split: core, question: "How many orders were placed in 2025?",
     gold: "select count(*) from fct_orders where year(order_date) = 2025"}
  - {id: c03, split: core, question: "How many orders were cancelled in Q1 2026?",
     gold: "select count(*) from fct_orders where status = 'cancelled' and order_date between date '2026-01-01' and date '2026-03-31'"}
  - {id: c04, split: core, ordered: true, question: "Who are the top 5 customers by lifetime revenue?",
     gold: "select customer_name, lifetime_revenue from dim_customers order by lifetime_revenue desc limit 5"}
  - {id: c05, split: core, ordered: true, question: "What was revenue by product category in 2025?",
     gold: "select category, round(sum(net_revenue), 2) r from fct_order_lines where year(order_date) = 2025 group by category order by r desc"}
  - {id: c06, split: core, ordered: true, question: "What was the average order value by month in 2025?",
     gold: "select order_month, avg_order_value from mart_monthly_revenue where year(order_month) = 2025 order by order_month"}
  - {id: c07, split: core, question: "Which month had the highest net revenue in 2025?",
     gold: "select order_month, net_revenue from mart_monthly_revenue where year(order_month) = 2025 order by net_revenue desc limit 1"}
  - {id: c08, split: core, question: "How many customers do we have per country?",
     gold: "select country, count(*) from dim_customers group by country"}
  - {id: c09, split: core, question: "What was the cancellation rate in 2025?",
     gold: "select round(100.0 * sum(case when status = 'cancelled' then 1 else 0 end) / count(*), 2) from fct_orders where year(order_date) = 2025"}
  - {id: c10, split: core, ordered: true, question: "Which 3 products sold the most units in 2026?",
     gold: "select l.product_name, sum(l.quantity) u from fct_order_lines l join fct_orders o using (order_id) where o.status in ('completed', 'shipped') and year(o.order_date) = 2026 group by 1 order by u desc limit 3"}
  - {id: c11, split: core, question: "How many customers have placed more than 15 orders?",
     gold: "select count(*) from dim_customers where lifetime_orders > 15"}
  - {id: c12, split: core, question: "What share of orders came from each channel in 2025?",
     gold: "select channel, round(100.0 * count(*) / (select count(*) from fct_orders where year(order_date) = 2025), 2) from fct_orders where year(order_date) = 2025 group by channel"}
  - {id: c13, split: core, ordered: true, question: "How many new customers signed up each month in 2026?",
     gold: "select date_trunc('month', signup_date), count(*) from dim_customers where year(signup_date) = 2026 group by 1 order by 1"}
  - {id: c14, split: core, question: "What was total revenue from customers in Germany?",
     gold: "select round(sum(lifetime_revenue), 2) from dim_customers where country = 'DE'"}
  - {id: c15, split: core, question: "List the names of customers in the business segment who signed up in 2026",
     gold: "select customer_name from dim_customers where segment = 'business' and year(signup_date) = 2026"}
  - {id: c16, split: core, question: "How many customers have never placed an order?",
     gold: "select count(*) from dim_customers where first_order_date is null"}
  - {id: c17, split: core, question: "What was the total discount given in 2025?",
     gold: "select round(sum(discount_amount), 2) from fct_orders where year(order_date) = 2025"}
  - {id: c18, split: core, ordered: true, question: "What was revenue in each quarter of 2025?",
     gold: "select quarter(order_month), round(sum(net_revenue), 2) from mart_monthly_revenue where year(order_month) = 2025 group by 1 order by 1"}
  - {id: c19, split: core, question: "What is the average number of units per order for completed orders?",
     gold: "select round(avg(units), 2) from fct_orders where status = 'completed'"}
  - {id: c20, split: core, question: "Which customer segment generated the most revenue in 2026?",
     gold: "select c.segment, round(sum(o.net_revenue), 2) r from fct_orders o join dim_customers c using (customer_id) where year(o.order_date) = 2026 group by 1 order by r desc limit 1"}

  - {id: p01, split: paraphrase, question: "How much did we make in March 2026?", gold_ref: c01}
  - {id: p02, split: paraphrase, question: "Number of orders in 2025?", gold_ref: c02}
  - {id: p03, split: paraphrase, question: "Give me the five best customers by spend", gold_ref: c04}
  - {id: p04, split: paraphrase, question: "Sales split by category for 2025", gold_ref: c05}
  - {id: p05, split: paraphrase, question: "What fraction of 2025 orders were cancelled?", gold_ref: c09}
  - {id: p06, split: paraphrase, question: "Which country has the most customers?",
     gold: "select country, count(*) n from dim_customers group by 1 order by n desc limit 1"}
  - {id: p07, split: paraphrase, question: "In 2025, what was the AOV each month?", gold_ref: c06}
